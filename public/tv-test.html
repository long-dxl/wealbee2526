<!doctype html>
<!--
  Trang test độc lập, KHÔNG thuộc app React — chỉ để CTO xem thử chất lượng chart
  TradingView với mã AAA (HOSE) trước khi quyết định có thay chart tự vẽ hay không.
  Đặt trong public/ để Vite serve tĩnh, không đụng vào route/component nào của app
  (tránh xung đột với phiên khác đang sửa ticker-detail-page.tsx).
  Xoá file này sau khi test xong nếu không dùng tới.
-->
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <title>Test TradingView chart — AAA (HOSE)</title>
  <style>
    body { margin: 0; font-family: system-ui, sans-serif; background: #f5f5f7; }
    .bar { display: flex; align-items: center; gap: 12px; padding: 14px 20px; background: #fff; border-bottom: 1px solid #e5e5ea; }
    .bar h1 { font-size: 15px; margin: 0; }
    .bar select { padding: 6px 10px; border-radius: 6px; border: 1px solid #d0d0d8; font-size: 13px; }
    .wrap { padding: 16px; }
    .card { background: #fff; border-radius: 12px; border: 1px solid #e5e5ea; overflow: hidden; }
    .tradingview-widget-container { height: 600px; }
  </style>
</head>
<body>
  <div class="bar">
    <h1>Test chart TradingView</h1>
    <select id="symbolSelect">
      <option value="HOSE:AAA">AAA (Nhựa An Phát Xanh) — HOSE</option>
      <option value="HOSE:VCB">VCB — HOSE</option>
      <option value="HNX:SHS">SHS — HNX</option>
    </select>
    <select id="themeSelect">
      <option value="light">Light</option>
      <option value="dark">Dark</option>
    </select>
  </div>
  <div class="wrap">
    <div class="card">
      <div id="chartHost"></div>
    </div>
  </div>

  <script>
    function renderWidget(symbol, theme) {
      const host = document.getElementById("chartHost");
      host.innerHTML = "";
      const container = document.createElement("div");
      container.className = "tradingview-widget-container";
      const script = document.createElement("script");
      script.src = "https://s3.tradingview.com/external-embedding/embed-widget-advanced-chart.js";
      script.async = true;
      script.innerHTML = JSON.stringify({
        autosize: true,
        symbol: symbol,
        interval: "D",
        timezone: "Asia/Ho_Chi_Minh",
        theme: theme,
        style: "1",
        locale: "vi_VN",
        allow_symbol_change: true,
        support_host: "https://www.tradingview.com"
      });
      container.appendChild(script);
      host.appendChild(container);
    }

    const symbolSelect = document.getElementById("symbolSelect");
    const themeSelect = document.getElementById("themeSelect");
    function update() { renderWidget(symbolSelect.value, themeSelect.value); }
    symbolSelect.addEventListener("change", update);
    themeSelect.addEventListener("change", update);
    update();
  </script>
</body>
</html>
